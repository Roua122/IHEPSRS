<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>خلود — تكامل الأنظمة</title><style>body{font-family:Tahoma,Arial;background:#f1f5f9;color:#172554;max-width:1000px;margin:30px auto;padding:15px}header,section{background:white;border-radius:12px;padding:20px;margin:15px 0;box-shadow:0 2px 10px #0001}button{background:#155e75;color:white;border:0;border-radius:7px;padding:12px 18px;cursor:pointer;margin:4px}button:hover{background:#0e7490}pre{background:#0f172a;color:#d1fae5;direction:ltr;text-align:left;padding:15px;white-space:pre-wrap;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:right}h1{color:#0f766e}</style><header><h1>IHEPSRS — عرض مهمة خلود</h1><p>Mock University → Integration Core → Central Student Registry</p><p>هذا نموذج مستقل للتوضيح، وليس واجهة النظام الوطني.</p></header><section><h2>١. جربي سيناريو التكامل</h2><button onclick="send('new')">إرسال طالب جديد</button><button onclick="send('duplicate')">إعادة نفس الرسالة (تكرار)</button><button onclick="send('stale')">إرسال تحديث قديم</button><button onclick="send('newer')">إرسال تحديث أحدث</button><button onclick="send('scope')">اختبار مؤسسة خاطئة</button><button onclick="send('invalid')">اختبار بيانات ناقصة</button><p id="result"></p></section><section><h2>٢. Integration Monitor</h2><div id="counts"></div><table><thead><tr><th>Message ID</th><th>النتيجة</th><th>السبب</th></tr></thead><tbody id="rows"></tbody></table></section><section><h2>٣. السجل المركزي للطلاب</h2><pre id="students"></pre></section><section><h2>٤. Security Events</h2><pre id="security"></pre></section><script>let original=null, counter=1;const iso=(offset=0)=>new Date(Date.now()+offset).toISOString();async function api(path,data){return(await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})).json()}async function send(kind){let e;if(kind==='duplicate'&&original){e=structuredClone(original)}else{e={sourceSystem:'UNI-A-SIS',messageId:'DEMO-'+counter++,externalId:'UNI-A-ST-1001',eventTime:iso(),contractVersion:'1.0',payload:{institutionId:'UNI-A',studentNumber:'2026001',fullName:'طالب تجريبي'}};if(kind==='new'||!original)original=structuredClone(e);if(kind==='stale')e.eventTime=iso(-86400000);if(kind==='newer')e.payload.fullName='طالب محدث';if(kind==='scope')e.payload.institutionId='UNI-B';if(kind==='invalid')delete e.externalId;}let r=await api('/api/send',e);document.getElementById('result').textContent='النتيجة: '+r.status+' — '+(r.reason||'تمت المعالجة');await refresh()}async function refresh(){let s=await(await fetch('/api/state')).json();document.getElementById('counts').textContent='عدد الطلاب: '+s.students.length+' | عدد الرسائل: '+s.messages.length;document.getElementById('rows').replaceChildren(...s.messages.slice().reverse().map(m=>{let tr=document.createElement('tr');[m.messageId,m.status,m.reason].forEach(x=>{let td=document.createElement('td');td.textContent=x||'—';tr.append(td)});return tr}));document.getElementById('students').textContent=JSON.stringify(s.students,null,2);document.getElementById('security').textContent=JSON.stringify(s.securityEvents,null,2)}refresh()</script></html>
