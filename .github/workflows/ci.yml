name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm quality

      - name: Configuration check
        run: pnpm config:check

      - name: IAM-001 model tests
        run: pnpm --filter @ihepsrs/api iam001:check

      - name: Runtime smoke tests
        run: pnpm test:smoke
