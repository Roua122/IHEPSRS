name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.8.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency advisory gate (high/critical)
        run: pnpm audit --audit-level high

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL JavaScript/TypeScript SAST
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v4
